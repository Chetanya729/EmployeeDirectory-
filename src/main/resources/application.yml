spring:
  application:
    name: MapperProject

  datasource:
    url: jdbc:mysql://localhost:3306/mapperdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cache:
    type: redis
    cache-names:
      - employees.mapstruct
      - employees.mm
    redis:
      time-to-live: 60s
      cache-null-values: false
  data:
    redis:
      host: localhost
      port: 6379

  logging:
    level:
      root: INFO
      org.springframework.web: DEBUG
      com.example.MapperProject: TRACE
spring:
  application:
    name: MapperProject

  datasource:
    url: jdbc:mysql://localhost:3306/mapperdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: jcache
        javax:
          cache:
            provider: org.ehcache.jsr107.EhcacheCachingProvider
        jakarta:
          persistence:
            sharedCache:
              mode: ENABLE_SELECTIVE

  cache:
    type: simple
    cache-names:
      - employees.mapstruct
      - employees.mm

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.example.MapperProject.controller.EmployeeController: TRACE
